[project]
name = "brl-mesh-generator"
version = "0.1.0"
description = "Gmsh surface mesh generation with verified NAS publication"
requires-python = ">=3.12,<3.13"
dependencies = [
  "gmsh==4.15.2",
  "numpy==1.26.4",
  "pyNastran==1.4.1",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Windows Gmsh DLL calls fail with pytest's native file-descriptor capture.
addopts = "-q --capture=sys --import-mode=importlib -p no:cacheprovider"
