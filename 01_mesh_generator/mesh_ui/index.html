<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRL 메시 생성기</title>
<style>
:root{font-family:system-ui,"Malgun Gothic",sans-serif;color:#e9f1f8;background:#101720}*{box-sizing:border-box}body{margin:0;height:100vh;min-height:680px;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:15px 22px;background:#19232f;border-bottom:1px solid #354253;gap:16px}h1{font-size:20px;margin:0}.muted{color:#aabbd0;font-size:12px}button{font:inherit;cursor:pointer;border:1px solid #5685a8;background:#28618c;color:#fff;border-radius:7px;padding:8px 13px}button:hover{background:#3679a8}button:disabled{opacity:.5;cursor:wait}.secondary{background:#263747;border-color:#526274}
main{display:grid;grid-template-columns:minmax(335px,390px) minmax(0,1fr);flex:1;min-height:0}.controls{overflow:auto;padding:16px 18px 24px;border-right:1px solid #354253}.controls h2{font-size:14px;color:#a8d5fa;margin:18px 0 9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#bdcede}.field.wide{grid-column:1/-1}input,select{font:inherit;width:100%;color:#f2f7fb;background:#172738;border:1px solid #455d74;border-radius:5px;padding:7px 8px;min-width:0}input[type=checkbox]{width:auto;accent-color:#59aeea}.check{font-size:13px;display:flex;align-items:center;gap:8px;margin:9px 0}.check input{margin:0}.actions{display:flex;gap:8px;margin:16px 0 10px}.actions button{flex:1}.status{padding:10px;background:#182b3a;border:1px solid #3a566c;border-radius:7px;font-size:13px;overflow-wrap:anywhere}.status.error{color:#ffb7a9;border-color:#ad6560}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;color:#b9cadc;max-height:130px;overflow:auto}iframe{width:100%;height:100%;border:0;background:#101720}.viewer{min-height:0}.hint{font-size:11px;color:#9cacc0;line-height:1.5}@media(max-width:800px){body{height:auto}main{display:block}.controls{max-height:none}.viewer{height:65vh;min-height:480px}}
</style></head><body>
<header><div><h1>BRL 표면 메시 생성기</h1><div class="muted">형상 설정 → 메시 생성 → NAS 확인</div></div><button id="shutdown" class="secondary">서버 종료</button></header>
<main><section class="controls">
<div class="grid"><label class="field wide">결과 이름<input id="name" value="wave_mesh"></label><label class="field wide">출력 폴더<input id="output" value="outputs" title="상대 경로는 메시 생성기 폴더 기준"></label></div>
<h2>형상</h2><div class="grid">
<label class="field wide">형상<select id="kind"><option>plate</option><option>disk</option><option>sphere</option><option>box</option><option>cylinder</option><option>ogive</option><option>cad</option></select></label>
<label class="field wide">CAD 파일 업로드<input id="cadFile" type="file" accept=".step,.stp,.iges,.igs,.brep"></label>
<label class="field wide">또는 로컬 CAD 경로<input id="cadPath" placeholder="C:\models\part.step"></label>
<label class="field">길이<input id="length" type="number" step="any" value="120"></label><label class="field">너비<input id="width" type="number" step="any" value="80"></label><label class="field">높이<input id="height" type="number" step="any" value="30"></label><label class="field">반지름<input id="radius" type="number" step="any" value="20"></label>
<label class="field">ogive D<input id="D" type="number" step="any" value="110"></label><label class="field">ogive L<input id="L" type="number" step="any" value="200"></label><label class="field">ogive t<input id="t" type="number" step="any" value="3"></label><div class="hint field wide">ogive: t=0은 밑면이 열린 곡면, t&gt;0은 벽 두께 솔리드입니다. 1차 삼각형 표면 메시를 생성합니다.</div><label class="field">입력 길이 단위<select id="inputUnit"><option>mm</option><option>cm</option><option>m</option><option>um</option></select></label><label class="field">NAS·상자 좌표 단위<select id="outputUnit"><option>mm</option><option>cm</option><option>m</option><option>um</option></select></label></div>
<h2>파장 및 크기</h2><div class="grid"><label class="field">주파수 (GHz)<input id="frequency" type="number" step="any" value="10"></label><label class="field">파장당 요소 수<input id="perWave" type="number" step="any" value="10"></label><label class="field">상대 유전율 εr<input id="epsr" type="number" step="any" value="1"></label><label class="field">상대 투자율 μr<input id="mur" type="number" step="any" value="1"></label><label class="field wide">전역 크기 / 모델 크기<input id="scale" type="number" step="any" value="0.06"></label></div>
<h2>국소 세분화</h2><label class="check"><input id="local" type="checkbox" checked>국소 세분화 활성화 (작은 특징·상자)</label><div class="grid"><label class="field">작은 특징 판정 비율<input id="threshold" type="number" step="any" value="0.25"></label><label class="field">근처 / 전역 크기 비율<input id="near" type="number" step="any" value="0.25"></label><label class="field wide">전이 거리 / 모델 크기<input id="transition" type="number" step="any" value="0.15"></label></div>
<label class="check"><input id="box" type="checkbox">직접 지정한 상자 국소 세분화</label><div class="grid" id="boxFields"><label class="field">xmin<input id="xmin" type="number" step="any" value="0"></label><label class="field">xmax<input id="xmax" type="number" step="any" value="20"></label><label class="field">ymin<input id="ymin" type="number" step="any" value="0"></label><label class="field">ymax<input id="ymax" type="number" step="any" value="20"></label><label class="field">zmin<input id="zmin" type="number" step="any" value="-1"></label><label class="field">zmax<input id="zmax" type="number" step="any" value="1"></label><label class="field wide">상자 크기 (출력 단위)<input id="boxSize" type="number" step="any" value="1"></label></div>
<div class="actions"><button id="generate">메시 생성</button></div><div id="jobStatus" class="status" role="status">대기 중 · 목표 크기는 해석 정확도 보증이 아닙니다.</div><pre id="details"></pre><div class="hint">오른쪽 뷰어에서 기존 NAS 파일도 열 수 있습니다. 서버 종료 버튼이나 실행 창의 Ctrl+C로 종료하세요.</div>
</section><section class="viewer"><iframe id="viewer" src="/viewer.html" title="NAS 표면 메시 뷰어"></iframe></section></main>
<script>
"use strict";
const token="__SESSION_TOKEN__",$=id=>document.getElementById(id);
function number(id){const n=Number($(id).value);if(!$(id).value.trim()||!Number.isFinite(n))throw Error(id+": 유한한 숫자를 입력하세요.");return n}
function setStatus(message,error=false){$("jobStatus").textContent=message;$("jobStatus").classList.toggle("error",error)}
async function api(path,options={}){const response=await fetch(path,{...options,headers:{"X-Session-Token":token,...options.headers}});if(!response.ok){let problem;try{problem=(await response.json()).error}catch{problem=response.statusText}throw Error(problem||"HTTP "+response.status)}return response}
function config(cadPath){const kind=$("kind").value,parameters={};const required={plate:["length","width"],disk:["radius"],sphere:["radius"],box:["length","width","height"],cylinder:["radius","height"],ogive:["D","L","t"]};if(kind!=="cad")for(const key of required[kind])parameters[key]=number(key);
 const geometry=kind==="cad"?{kind,path:cadPath}:{kind,parameters};const boxes=$("box").checked?[{min:[number("xmin"),number("ymin"),number("zmin")],max:[number("xmax"),number("ymax"),number("zmax")],size:number("boxSize") }]:[];
 return {version:1,name:$("name").value.trim(),output_dir:$("output").value.trim(),length_unit:$("inputUnit").value,output_unit:$("outputUnit").value,geometry,mesh:{mode:"auto",scale_fraction:number("scale"),wave:{enabled:true,frequency_hz:number("frequency")*1e9,elements_per_wavelength:number("perWave"),relative_permittivity:number("epsr"),relative_permeability:number("mur")},local:{enabled:$("local").checked,feature_threshold_fraction:number("threshold"),near_size_fraction:number("near"),transition_fraction:number("transition"),boxes}}};}
async function generate(){const button=$("generate");button.disabled=true;$("details").textContent="";try{let cadPath=$("cadPath").value.trim();if($("kind").value==="cad"&&$("cadFile").files.length){const file=$("cadFile").files[0];setStatus("CAD 파일 업로드 중…");const response=await api("/api/upload-cad?name="+encodeURIComponent(file.name),{method:"POST",body:file,headers:{"Content-Type":"application/octet-stream"}});cadPath=(await response.json()).path}
 const payload=config(cadPath);setStatus("메시 생성 중…");const started=await api("/api/jobs",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const id=(await started.json()).id;
 for(;;){await new Promise(resolve=>setTimeout(resolve,350));const job=await(await api("/api/jobs/"+id)).json();if(job.state==="running")continue;$("details").textContent=[job.stderr,job.error].filter(Boolean).join("\n");if(job.state!=="complete")throw Error(job.error||"생성 실패");const nas=await(await api("/api/results/"+id)).text();$("viewer").contentWindow.postMessage({type:"brl-load-nas",text:nas,name:payload.name+".nas"},location.origin);setStatus("완료: "+job.status+" · "+job.output_directory);break}
 }catch(error){setStatus("오류: "+error.message,true)}finally{button.disabled=false}}
$("generate").addEventListener("click",generate);
$("local").addEventListener("change",()=>{if(!$("local").checked)$("box").checked=false;$("box").disabled=!$("local").checked});
$("shutdown").addEventListener("click",async()=>{try{await api("/api/shutdown",{method:"POST",body:"stop"});setStatus("서버가 종료되었습니다. 이 탭을 닫아도 됩니다.");$("generate").disabled=true;$("shutdown").disabled=true}catch(error){setStatus("종료 오류: "+error.message,true)}});
</script></body></html>
